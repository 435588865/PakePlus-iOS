<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF8FA3">
<title>生活记录台</title>
<style>
:root {
  --pink1: #FF8FA3; --pink2: #FFB3C1; --pink3: #FFD6E0; --pink4: #FFF0F3;
  --rose: #FF4D6D; --rose2: #FF758F;
  --text: #3D1A1F; --text2: #6B4B52; --text3: #9E7A82;
  --bg: #FFF5F7; --card: #FFFFFF; --border: #FFE0E6;
  --green: #2ECC71; --shadow: 0 4px 20px rgba(255,143,163,0.15);
  --radius: 20px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 90px;
}
.header {
  background: linear-gradient(135deg, var(--pink1) 0%, var(--rose) 100%);
  padding: 24px 16px 28px; border-radius: 0 0 28px 28px; color: #fff;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.header::before { content:""; position:absolute; top:-40px; right:-40px; width:140px; height:140px; background:rgba(255,255,255,0.15); border-radius:50%; }
.header-title { font-size:13px; opacity:0.92; letter-spacing:1px; margin-bottom:4px; }
.header-days { font-size:42px; font-weight:700; line-height:1; margin-bottom:6px; }
.header-sub { font-size:14px; opacity:0.9; }
.stats-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; padding:16px; margin-top:-10px; }
.stat-card { background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); border:1px solid var(--border); }
.stat-card .label { font-size:12px; color:var(--text3); margin-bottom:6px; display:flex; align-items:center; gap:5px; }
.stat-card .label svg { width:14px; height:14px; fill:var(--pink1); }
.stat-card .value { font-size:22px; font-weight:700; color:var(--rose); }
.stat-card .sub { font-size:11px; color:var(--text2); margin-top:4px; }
.section { padding:0 16px 16px; }
.card { background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow); border:1px solid var(--border); }
.card-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; cursor:pointer; }
.card-icon { width:56px; height:56px; border-radius:16px; object-fit:cover; border:2px solid var(--pink3); background:var(--pink4); }
.card-title { flex:1; font-size:17px; font-weight:700; color:var(--text); }
.card-arrow { font-size:12px; color:var(--text3); transition: transform 0.25s; }
.card.collapsed .card-arrow { transform: rotate(-90deg); }
.card.collapsed .card-body { display:none; }
.card-body { margin-top:6px; }
.input-row { display:flex; gap:10px; margin-bottom:10px; }
.input-row input { flex:1; min-width:0; padding:12px 14px; border:1px solid var(--border); border-radius:12px; font-size:16px; background:var(--pink4); color:var(--text); outline:none; }
.input-row input:focus { border-color:var(--pink1); box-shadow:0 0 0 3px rgba(255,143,163,0.15); }
.btn { border:none; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; transition:all 0.2s; }
.btn:active { transform:scale(0.97); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn-primary { background:linear-gradient(135deg,var(--pink1),var(--rose)); color:#fff; box-shadow:0 4px 12px rgba(255,77,109,0.25); }
.btn-primary2 { background:linear-gradient(135deg,var(--pink2),var(--pink1)); color:#fff; }
.btn-outline { background:#fff; border:1.5px solid var(--pink2); color:var(--rose); }
.btn-danger { background:#FFF0F1; color:var(--rose); }
.btn-sm { padding:8px 14px; font-size:13px; }
.btn-block { width:100%; }
.sleep-status { text-align:center; padding:8px 0; font-size:16px; font-weight:700; color:var(--text2); }
.sleep-status.recording { color:var(--rose); }
.sleep-info { text-align:center; font-size:13px; color:var(--text3); margin-bottom:10px; }
.sleep-result { margin-top:12px; padding:12px; border-radius:14px; text-align:center; font-weight:700; font-size:15px; }
.sleep-result.pass { background:#E8F9F0; color:var(--green); }
.sleep-result.fail { background:#FFF0F1; color:var(--rose); }
.detail-list { margin-top:10px; }
.detail-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed var(--border); font-size:14px; }
.detail-item:last-child { border-bottom:none; }
.detail-name { color:var(--text); font-weight:500; }
.detail-value { color:var(--rose); font-weight:600; }
.detail-del { background:none; border:none; color:var(--text3); font-size:13px; margin-left:10px; cursor:pointer; }
.summary-card { background:linear-gradient(135deg,var(--pink4),#fff); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin:0 16px 16px; box-shadow:var(--shadow); }
.summary-title { font-size:16px; font-weight:700; margin-bottom:10px; color:var(--rose); }
.summary-body { font-size:14px; line-height:1.9; color:var(--text); white-space:pre-wrap; }
.chart-wrap { margin-top:14px; background:var(--pink4); border-radius:16px; padding:14px; }
.chart-title { font-size:13px; color:var(--text2); margin-bottom:10px; font-weight:600; }
.weight-empty { text-align:center; color:var(--text3); font-size:13px; padding:20px 0; }
.page { display:none; padding-bottom:20px; }
.page.active { display:block; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.96); backdrop-filter:blur(12px); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); z-index:100; }
.nav-btn { flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text3); font-size:11px; cursor:pointer; padding:6px 0; }
.nav-btn svg { width:24px; height:24px; fill:currentColor; }
.nav-btn.active { color:var(--rose); }
.history-card { background:var(--card); border-radius:var(--radius); padding:16px; margin:16px; box-shadow:var(--shadow); border:1px solid var(--border); }
.history-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.history-date { font-size:17px; font-weight:700; color:var(--rose); }
.history-section { margin-bottom:14px; }
.history-section-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:6px; }
.history-item { font-size:13px; color:var(--text2); padding:4px 0; border-bottom:1px dashed var(--border); }
.history-empty { text-align:center; color:var(--text3); padding:40px 0; font-size:14px; }
.setting-item { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); }
.setting-item:last-child { border-bottom:none; }
.setting-label { font-size:15px; font-weight:500; }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(61,26,31,0.88); color:#fff; padding:14px 24px; border-radius:12px; font-size:14px; z-index:200; opacity:0; pointer-events:none; transition:opacity 0.3s; }
.toast.show { opacity:1; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:150; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card); border-radius:var(--radius); padding:20px; width:100%; max-width:320px; text-align:center; }
.modal-title { font-size:17px; font-weight:700; margin-bottom:10px; }
.modal-text { font-size:14px; color:var(--text2); margin-bottom:18px; line-height:1.6; }
.modal-btns { display:flex; gap:10px; }
.modal-btns .btn { flex:1; }
.tip { font-size:12px; color:var(--text3); line-height:1.7; padding:12px 16px; }
hr { border:none; border-top:1px dashed var(--border); margin:8px 0; }
</style>
</head>
<body>

<!-- PAGE: HOME -->
<div class="page active" id="pageHome">
  <div class="header">
    <div class="header-title">生活记录台</div>
    <div class="header-days" id="streakDays">0 天</div>
    <div class="header-sub">坚持记录，成为更好的自己</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">

      <div class="value" id="statDiet">0 项</div>

      <div class="sub">元</div>
    </div>
    <div class="stat-card">
      <div class="label"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7zm-1-11h2v3h3v2h-3v3h-2v-3H8v-2h3V8z"/></svg>最新体重</div>
      <div class="value" id="statWeight">—</div>
      <div class="sub" id="statWeightChange">斤</div>
    </div>
    <div class="stat-card">
      <div class="label"><svg viewBox="0 0 24 24"><path d="M23 3H1v18h22V3zm-2 16H3V5h18v14zM8 15c0-1.66 1.34-3 3-3 .35 0 .69.07 1 .18V6h5v2h-3v7c0 1.66-1.34 3-3 3s-3-1.34-3-3z"/></svg>昨夜睡眠</div>
      <div class="value" id="statSleep">—</div>
      <div class="sub" id="statSleepQual">—</div>
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-title">今日总结</div>
    <div class="summary-body" id="todaySummary">暂无数据，快开始记录吧～</div>
    <button class="btn btn-outline btn-sm btn-block" onclick="copySummary()" style="margin-top:12px;">复制总结</button>
  </div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Delete confirm -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-title">确认操作</div>
    <div class="modal-text" id="confirmText"></div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeConfirm()">取消</button>
      <button class="btn btn-primary" id="confirmBtn" onclick="runConfirm()">确认</button>
    </div>
  </div>
</div>

<script>
/* ==================== CONSTANTS & UTILS ==================== */
const TODAY = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-');
const STORAGE_KEY = 'wb_pinklife';

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getDB() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}

function saveDB(db) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function getTodayData() {
  const db = getDB();
  const dk = today();
  if (!db[dk]) db[dk] = { diet: [], expenses: [], weight: null, sleep: null };
  return db[dk];
}

function saveTodayData(td) {
  const db = getDB();
  db[today()] = td;
  saveDB(db);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}

let _cfAction = null;
function showConfirm(text, action) {
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmModal').classList.add('show');
  _cfAction = action;
}
function closeConfirm() { document.getElementById('confirmModal').classList.remove('show'); _cfAction = null; }
function runConfirm() { if (_cfAction) _cfAction(); closeConfirm(); }

/* ==================== TOGGLE CARD ==================== */
function toggleCard(name) {
  const card = document.getElementById('card-' + name);
  card.classList.toggle('collapsed');
  // Save collapsed state
  const collapsed = JSON.parse(localStorage.getItem('wb_pink_collapsed') || '{}');
  collapsed[name] = card.classList.contains('collapsed');
  localStorage.setItem('wb_pink_collapsed', JSON.stringify(collapsed));
}

function initCards() {
  const collapsed = JSON.parse(localStorage.getItem('wb_pink_collapsed') || '{}');
  for (const [name, val] of Object.entries(collapsed)) {
    if (val) {
      const card = document.getElementById('card-' + name);
      if (card) card.classList.add('collapsed');
    }
  }
}

/* ==================== STREAK ==================== */
function calcStreak() {
  const db = getDB();
  const dates = Object.keys(db).sort().reverse();
  if (dates.length === 0) return 0;
  let streak = 0;
  const msDay = 86400000;
  let expected = new Date(today() + 'T00:00:00');
  for (const d of dates) {
    const dDate = new Date(d + 'T00:00:00');
    if (dDate.getTime() >= expected.getTime() - msDay) {
      streak++;
      expected = dDate;
    } else {
      break;
    }
  }
  return streak;
}

/* ==================== NAVIGATION ==================== */
function switchPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-page="' + pageId + '"]').classList.add('active');
  if (pageId === 'pageHistory') renderHistory();
  if (pageId === 'pageHome') refreshHome();
}

/* ==================== DIET ==================== */
function addDiet() {
  const el = document.getElementById('dietItem');
  const item = el.value.trim();
  if (!item) { showToast('请输入食物名称'); return; }
  const td = getTodayData();
  td.diet.push(item);
  saveTodayData(td);
  el.value = '';
  el.focus();
  renderDiet();
  refreshHome();
  showToast('已记录: ' + item);
}

function deleteDiet(idx) {
  const td = getTodayData();
  td.diet.splice(idx, 1);
  saveTodayData(td);
  renderDiet();
  refreshHome();
}

function renderDiet() {
  const td = getTodayData();
  const list = document.getElementById('dietList');
  if (td.diet.length === 0) { list.innerHTML = ''; return; }
  list.innerHTML = td.diet.map((item, i) =>
    '<div class="detail-item">' +
    '<span class="detail-name">' + (i+1) + '. ' + htmlEscape(item) + '</span>' +
    '<button class="detail-del" onclick="deleteDiet(' + i + ')">删除</button>' +
    '</div>'
  ).join('');
}

function htmlEscape(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ==================== EXPENSE ==================== */
function addExpense() {
  const typeEl = document.getElementById('expType');
  const amtEl = document.getElementById('expAmount');
  const type = typeEl.value.trim();
  const amount = parseFloat(amtEl.value);
  if (!type) { showToast('请输入支出类型'); return; }
  if (isNaN(amount) || amount <= 0) { showToast('请输入有效金额'); return; }
  const td = getTodayData();
  td.expenses.push({ type, amount: Math.round(amount * 100) / 100 });
  saveTodayData(td);
  typeEl.value = '';
  amtEl.value = '';
  typeEl.focus();
  renderExpenses();
  refreshHome();
  showToast('已记录: ' + type + ' ' + amount.toFixed(2) + ' 元');
}

function deleteExpense(idx) {
  const td = getTodayData();
  td.expenses.splice(idx, 1);
  saveTodayData(td);
  renderExpenses();
  refreshHome();
}

function renderExpenses() {
  const td = getTodayData();
  const list = document.getElementById('expList');
  if (td.expenses.length === 0) { list.innerHTML = ''; return; }
  list.innerHTML = td.expenses.map((e, i) =>
    '<div class="detail-item">' +
    '<span class="detail-name">' + (i+1) + '. ' + htmlEscape(e.type) + '</span>' +
    '<span class="detail-value">¥' + e.amount.toFixed(2) + '</span>' +
    '<button class="detail-del" onclick="deleteExpense(' + i + ')">删除</button>' +
    '</div>'
  ).join('');
  document.getElementById('expTotal').textContent = td.expenses.reduce((s,e) => s + e.amount, 0).toFixed(2);
}

/* ==================== WEIGHT ==================== */
function addWeight() {
  const el = document.getElementById('weightVal');
  const val = parseFloat(el.value);
  if (isNaN(val) || val < 20 || val > 300) { showToast('请输入有效体重 (20-300 斤)'); return; }
  const td = getTodayData();
  td.weight = Math.round(val * 10) / 10;
  saveTodayData(td);
  el.value = '';
  el.focus();
  renderWeightChart();
  refreshHome();
  showToast('体重已记录: ' + td.weight + ' 斤');
}

function getWeightHistory() {
  const db = getDB();
  const entries = [];
  for (const [date, data] of Object.entries(db)) {
    if (data.weight && data.weight > 0) {
      entries.push({ date, weight: data.weight });
    }
  }
  entries.sort((a,b) => a.date.localeCompare(b.date));
  return entries;
}

function renderWeightChart() {
  const entries = getWeightHistory();
  const chartEl = document.getElementById('weightChart');
  if (entries.length === 0) {
    chartEl.className = 'weight-empty';
    chartEl.innerHTML = '暂无数据，记录体重后显示趋势图';
    return;
  }
  if (entries.length === 1) {
    chartEl.className = 'weight-empty';
    chartEl.innerHTML = '当前体重: <b style="color:var(--rose);">' + entries[0].weight + '</b> 斤 (至少2条数据才会显示图表)';
    return;
  }

  // Take last 14 entries
  const recent = entries.slice(-14);
  const weights = recent.map(e => e.weight);
  const minW = Math.min(...weights) - 1;
  const maxW = Math.max(...weights) + 1;
  const range = maxW - minW || 1;

  const W = 320, H = 160, padL = 35, padR = 15, padT = 15, padB = 25;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  let points = '';
  const n = recent.length;
  for (let i = 0; i < n; i++) {
    const x = padL + (i / Math.max(n - 1, 1)) * plotW;
    const y = padT + (1 - (weights[i] - minW) / range) * plotH;
    points += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }

  // Grid lines
  let gridLines = '';
  for (let gv = minW; gv <= maxW; gv += Math.max(1, Math.ceil(range / 5))) {
    const gy = padT + (1 - (gv - minW) / range) * plotH;
    gridLines += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="#FFD6E0" stroke-width="0.5"/><text x="' + (padL - 4) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#9E7A82">' + gv + '</text>';
  }

  // Date labels
  let dateLabels = '';
  for (let i = 0; i < n; i++) {
    if (i === 0 || i === n - 1 || i % Math.ceil(n / 5) === 0) {
      const x = padL + (i / Math.max(n - 1, 1)) * plotW;
      const label = recent[i].date.slice(5);
      dateLabels += '<text x="' + x.toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="9" fill="#9E7A82">' + label + '</text>';
    }
  }

  // Points + values
  let dots = '';
  for (let i = 0; i < n; i++) {
    const x = padL + (i / Math.max(n - 1, 1)) * plotW;
    const y = padT + (1 - (weights[i] - minW) / range) * plotH;
    const isLast = i === n - 1;
    dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (isLast ? 5 : 3) + '" fill="' + (isLast ? '#FF4D6D' : '#FF8FA3') + '"/>';
    dots += '<text x="' + x.toFixed(1) + '" y="' + (y - 8).toFixed(1) + '" text-anchor="middle" font-size="10" font-weight="' + (isLast ? '700' : '500') + '" fill="' + (isLast ? '#FF4D6D' : '#FF8FA3') + '">' + weights[i] + '</text>';
  }

  chartEl.className = 'chart-wrap';
  chartEl.innerHTML = '<div class="chart-title">体重趋势 (近' + n + '天) - 单位: 斤</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:auto; max-width:400px; display:block; margin:0 auto;">' +
    gridLines + dateLabels +
    '<path d="' + points + '" fill="none" stroke="#FF8FA3" stroke-width="2.5" stroke-linejoin="round"/>' +
    dots +
    '</svg>';
}

/* ==================== SLEEP ==================== */
let sleepBedTimestamp = null;
let sleepState = 'idle';

function goToBed() {
  sleepBedTimestamp = Date.now();
  sleepState = 'sleeping';
  const bedTime = new Date(sleepBedTimestamp).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  localStorage.setItem('wb_pink_sleep_pending', JSON.stringify({ bedTimestamp: sleepBedTimestamp, bedTime }));

  document.getElementById('sleepStatus').textContent = '已记录';
  document.getElementById('sleepStatus').className = 'sleep-status recording';
  document.getElementById('sleepInfo').style.display = 'block';
  document.getElementById('sleepInfo').textContent = '入睡时间 ' + bedTime;
  document.getElementById('btnBed').disabled = true;
  document.getElementById('btnWake').disabled = false;
  document.getElementById('btnResetSleep').style.display = 'block';
  document.getElementById('sleepResult').style.display = 'none';
  showToast('已记录入睡 ' + bedTime);
}

function wakeUp() {
  if (!sleepBedTimestamp) return;
  const wakeTimestamp = Date.now();
  const bedTime = new Date(sleepBedTimestamp).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  const wakeTime = new Date(wakeTimestamp).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});

  const diffMs = wakeTimestamp - sleepBedTimestamp;
  const hours = (diffMs / 3600000).toFixed(1);
  const bedHour = new Date(sleepBedTimestamp).getHours();
  const qualified = bedHour < 23 && parseFloat(hours) >= 7;

  const td = getTodayData();
  td.sleep = { bedTimestamp: sleepBedTimestamp, wakeTimestamp, bedTime, wakeTime, duration: parseFloat(hours), qualified };
  saveTodayData(td);
  localStorage.removeItem('wb_pink_sleep_pending');

  sleepState = 'done';
  document.getElementById('sleepStatus').textContent = '记录完成';
  document.getElementById('sleepStatus').className = 'sleep-status';
  document.getElementById('sleepInfo').textContent = '入睡 ' + bedTime + ' → 睡醒 ' + wakeTime;
  document.getElementById('btnBed').disabled = true;
  document.getElementById('btnWake').disabled = true;

  const resultEl = document.getElementById('sleepResult');
  resultEl.style.display = 'block';
  if (qualified) {
    resultEl.className = 'sleep-result pass';
    resultEl.textContent = '睡眠达标 — ' + hours + ' 小时';
  } else {
    resultEl.className = 'sleep-result fail';
    resultEl.textContent = '睡眠未达标 — ' + hours + ' 小时 (标准: 23:00前, 7小时)';
  }
  refreshHome();
  showToast('睡眠: ' + hours + ' 小时');
}

function resetSleep() {
  sleepBedTimestamp = null;
  sleepState = 'idle';
  localStorage.removeItem('wb_pink_sleep_pending');
  document.getElementById('sleepStatus').textContent = '尚未记录';
  document.getElementById('sleepStatus').className = 'sleep-status';
  document.getElementById('sleepInfo').style.display = 'none';
  document.getElementById('btnBed').disabled = false;
  document.getElementById('btnWake').disabled = true;
  document.getElementById('btnResetSleep').style.display = 'none';
  document.getElementById('sleepResult').style.display = 'none';
  showToast('已重置');
}

function renderSleep() {
  const td = getTodayData();
  const resultEl = document.getElementById('sleepResult');
  if (!td.sleep) {
    resultEl.style.display = 'none';
    // Check pending
    const pending = localStorage.getItem('wb_pink_sleep_pending');
    if (pending) {
      try {
        const p = JSON.parse(pending);
        sleepBedTimestamp = p.bedTimestamp;
        sleepState = 'sleeping';
        document.getElementById('sleepStatus').textContent = '已记录';
        document.getElementById('sleepStatus').className = 'sleep-status recording';
        document.getElementById('sleepInfo').style.display = 'block';
        document.getElementById('sleepInfo').textContent = '入睡时间 ' + p.bedTime;
        document.getElementById('btnBed').disabled = true;
        document.getElementById('btnWake').disabled = false;
        document.getElementById('btnResetSleep').style.display = 'block';
        return;
      } catch(e) { localStorage.removeItem('wb_pink_sleep_pending'); }
    }
    sleepBedTimestamp = null;
    sleepState = 'idle';
    document.getElementById('sleepStatus').textContent = '尚未记录';
    document.getElementById('sleepStatus').className = 'sleep-status';
    document.getElementById('sleepInfo').style.display = 'none';
    document.getElementById('btnBed').disabled = false;
    document.getElementById('btnWake').disabled = true;
    document.getElementById('btnResetSleep').style.display = 'none';
    return;
  }

  sleepBedTimestamp = td.sleep.bedTimestamp;
  sleepState = 'done';
  document.getElementById('sleepStatus').textContent = '记录完成';
  document.getElementById('sleepStatus').className = 'sleep-status';
  document.getElementById('sleepInfo').style.display = 'block';
  document.getElementById('sleepInfo').textContent = '入睡 ' + td.sleep.bedTime + ' → 睡醒 ' + td.sleep.wakeTime;
  document.getElementById('btnBed').disabled = true;
  document.getElementById('btnWake').disabled = true;
  document.getElementById('btnResetSleep').style.display = 'block';

  resultEl.style.display = 'block';
  if (td.sleep.qualified) {
    resultEl.className = 'sleep-result pass';
    resultEl.textContent = '睡眠达标 — ' + td.sleep.duration + ' 小时';
  } else {
    resultEl.className = 'sleep-result fail';
    resultEl.textContent = '睡眠未达标 — ' + td.sleep.duration + ' 小时 (标准: 23:00前, 7小时)';
  }
}

/* ==================== REFRESH HOME ==================== */
function refreshHome() {
  const td = getTodayData();
  const streak = calcStreak();
  document.getElementById('streakDays').textContent = streak + ' 天';

  // Diet stat
  document.getElementById('statDiet').textContent = td.diet.length + ' 项';
  document.getElementById('statDietName').textContent = td.diet.length > 0 ? td.diet[td.diet.length - 1] : '—';

  // Expense stat
  const totalExp = td.expenses.reduce((s,e) => s + e.amount, 0);
  document.getElementById('statExpense').textContent = totalExp.toFixed(2);
  document.getElementById('expTotal').textContent = totalExp.toFixed(2);

  // Weight stat
  if (td.weight) {
    document.getElementById('statWeight').textContent = td.weight;
    document.getElementById('statWeightChange').textContent = '斤';
  } else {
    document.getElementById('statWeight').textContent = '—';
    document.getElementById('statWeightChange').textContent = '斤';
  }

  // Sleep stat
  if (td.sleep) {
    document.getElementById('statSleep').textContent = td.sleep.duration + 'h';
    document.getElementById('statSleepQual').textContent = td.sleep.qualified ? '达标' : '未达标';
  } else {
    document.getElementById('statSleep').textContent = '—';
    document.getElementById('statSleepQual').textContent = '—';
  }

  // Summary
  updateSummary();
}

function updateSummary() {
  const td = getTodayData();
  let lines = [];
  lines.push(today().replace(/-/g, '年').replace(/-/, '月') + '日');

  // Diet
  if (td.diet.length > 0) {
    lines.push('饮食:');
    td.diet.forEach((item, i) => { lines.push('  ' + (i+1) + '. ' + item); });
  }

  // Expense
  if (td.expenses.length > 0) {
    lines.push('日常支出:');
    td.expenses.forEach((e, i) => { lines.push('  ' + (i+1) + '. ' + e.type + ' ¥' + e.amount.toFixed(2)); });
    const total = td.expenses.reduce((s,e) => s + e.amount, 0);
    lines.push('总消费: ' + total.toFixed(2) + ' 元');
  }

  // Weight
  if (td.weight) {
    lines.push('体重: ' + td.weight + ' 斤');
  }

  // Sleep
  if (td.sleep) {
    lines.push('睡眠: ' + td.sleep.duration + ' 小时 (' + td.sleep.bedTime + '-' + td.sleep.wakeTime + ') ' + (td.sleep.qualified ? '[达标]' : '[未达标]'));
  }

  if (lines.length <= 1) {
    document.getElementById('todaySummary').textContent = '暂无数据，快开始记录吧～';
  } else {
    document.getElementById('todaySummary').textContent = lines.join('\n');
  }
}

function copySummary() {
  const text = document.getElementById('todaySummary').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
  } else {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板');
  }
}

/* ==================== HISTORY ==================== */
let historyDate = today();

function changeHistory(delta) {
  const parts = historyDate.split('-').map(Number);
  const d = new Date(parts[0], parts[1]-1, parts[2]);
  d.setDate(d.getDate() + delta);
  historyDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  renderHistory();
}

function renderHistory() {
  document.getElementById('historyDate').textContent = historyDate;
  const db = getDB();
  const data = db[historyDate];
  const content = document.getElementById('historyContent');

  if (!data) {
    content.className = 'history-empty';
    content.textContent = '该日期暂无记录';
    return;
  }

  content.className = '';
  let html = '';

  // Diet
  html += '<div class="history-section"><div class="history-section-title">饮食</div>';
  if (data.diet && data.diet.length > 0) {
    data.diet.forEach((item, i) => { html += '<div class="history-item">' + (i+1) + '. ' + htmlEscape(item) + '</div>'; });
  } else { html += '<div style="color:var(--text3);font-size:13px;">无记录</div>'; }
  html += '</div>';

  // Expense
  html += '<div class="history-section"><div class="history-section-title">支出</div>';
  if (data.expenses && data.expenses.length > 0) {
    data.expenses.forEach((e, i) => { html += '<div class="history-item">' + (i+1) + '. ' + htmlEscape(e.type) + ' — ¥' + e.amount.toFixed(2) + '</div>'; });
    const total = data.expenses.reduce((s,e) => s + e.amount, 0);
    html += '<div class="history-item" style="font-weight:700;color:var(--rose);">总消费: ¥' + total.toFixed(2) + '</div>';
  } else { html += '<div style="color:var(--text3);font-size:13px;">无记录</div>'; }
  html += '</div>';

  // Weight
  html += '<div class="history-section"><div class="history-section-title">体重</div>';
  html += data.weight ? '<div class="history-item">' + data.weight + ' 斤</div>' : '<div style="color:var(--text3);font-size:13px;">无记录</div>';
  html += '</div>';

  // Sleep
  html += '<div class="history-section"><div class="history-section-title">睡眠</div>';
  if (data.sleep) {
    const qual = data.sleep.qualified ? '<span style="color:var(--green);">达标</span>' : '<span style="color:var(--rose);">未达标</span>';
    html += '<div class="history-item">' + data.sleep.duration + ' 小时 (' + data.sleep.bedTime + ' ~ ' + data.sleep.wakeTime + ') ' + qual + '</div>';
  } else { html += '<div style="color:var(--text3);font-size:13px;">无记录</div>'; }
  html += '</div>';

  content.innerHTML = html;
}

/* ==================== DATA MANAGEMENT ==================== */
function exportData() {
  const db = getDB();
  const json = JSON.stringify(db, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pink_life_backup_' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('备份已下载');
}

function importData(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const db = JSON.parse(e.target.result);
      if (typeof db !== 'object') throw new Error();
      showConfirm('导入数据将覆盖当前数据，确认继续？', () => {
        saveDB(db);
        showToast('数据已导入');
        location.reload();
      });
    } catch(err) {
      showToast('文件格式错误');
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
}

function clearAll() {
  showConfirm('确认清除所有数据？建议先导出备份！', () => {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem('wb_pink_sleep_pending');
    localStorage.removeItem('wb_pink_collapsed');
    showToast('数据已清除');
    location.reload();
  });
}

initCards();
refreshHome();
renderDiet();
renderExpenses();
renderWeightChart();
renderSleep();
